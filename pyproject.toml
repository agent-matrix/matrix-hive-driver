[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matrix-hive-driver"
version = "0.1.0"
description = "Governed execution driver that adapts Hive Runtime to Agent-Matrix execution contracts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name="Agent-Matrix", email="dev@agent-matrix.local"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
ollama = [
    "httpx>=0.27",
]

[project.scripts]
matrix-hive-driver = "matrix_hive_driver.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/matrix_hive_driver"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
